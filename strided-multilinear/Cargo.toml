[package]
name = "strided-multilinear"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/strided-multilinear"
description = "Executor for cuEquivariance-style segmented polynomials (sparse multilinear forms): fused sparse gather/segment/accumulate over strided CPU buffers."
keywords = ["tensor", "strided", "kernels", "sparse"]
categories = ["science", "mathematics", "algorithms"]
# The first increment of tensor4all/strided-rs#479. Publication is a maintainer
# release decision (`docs/design/cpu-kernel-boundaries.md`, "Verification and
# publication"); `cargo package` is still checked by hand.
publish = false

[dependencies]
# The executor fans out through strided-basic's budgeted primitive and reuses
# its sorted-run topology; a serial `Exec` still runs it inline.
strided-basic = { workspace = true, features = ["parallel"] }
# The lane kernel dispatches its SIMD level at run time
# (`docs/design/runtime-simd-dispatch.md`); the width comes from the selected
# level, never from a build-time target feature.
pulp.workspace = true
num-traits.workspace = true
thiserror.workspace = true

[dev-dependencies]
threadteam = { workspace = true, features = ["ledger"] }

[lib]
bench = false

[[bench]]
name = "executor"
harness = false
