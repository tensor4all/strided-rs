[package]
name = "strided-perm"
version = "0.7.0"
edition.workspace = true
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"
authors.workspace = true
repository.workspace = true
description = "Cache-efficient tensor permutation / transpose (HPTT-inspired)."
keywords = ["tensor", "permutation", "transpose", "multidimensional"]
categories = ["science", "mathematics", "algorithms"]

[dependencies]
strided-view.workspace = true
thiserror.workspace = true
tinyvec.workspace = true
strided-exec.workspace = true

[features]
# Forwards to the placement crate: without it every `Exec` runs inline.
parallel = ["strided-exec/parallel"]

[dev-dependencies]
strided-exec = { workspace = true, features = ["ledger"] }

[lib]
bench = false
