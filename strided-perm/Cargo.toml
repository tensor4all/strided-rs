[package]
name = "strided-perm"
version = "0.15.0"
edition.workspace = true
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"
authors.workspace = true
repository.workspace = true
description = "Cache-efficient tensor permutation / transpose (HPTT-inspired)."
keywords = ["tensor", "permutation", "transpose", "multidimensional"]
categories = ["science", "mathematics", "algorithms"]

[dependencies]
strided-view.workspace = true
thiserror.workspace = true
tinyvec.workspace = true
threadteam.workspace = true

[features]
# Forwards to the placement crate: without it every `Exec` runs inline.
parallel = ["threadteam/parallel"]

[dev-dependencies]
num-complex.workspace = true
threadteam = { workspace = true, features = ["ledger"] }

[[bench]]
name = "conj_copy"
harness = false
# The threaded column needs a real pool; a serial token would measure the same
# run twice.
required-features = ["parallel"]

[lib]
bench = false
