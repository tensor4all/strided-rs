name: Miri

# provenance 違反（Stacked Borrows / Tree Borrows）は Miri でしか観測できない。
# ただし 1 回 15〜20 分かかるので **PR ごとの必須レーンには置かない**。週次で回し、
# 失敗したら **issue を作る**（通知で終わらせない。issue なら手番と履歴が残る）。
on:
  schedule:
    - cron: "0 18 * * 0"   # 日曜 18:00 UTC = 月曜 03:00 JST（週 1 回）
  workflow_dispatch:

permissions:
  contents: read
  issues: write        # 失敗時に issue を作るため

env:
  CARGO_TERM_COLOR: always
  MIRIFLAGS: -Zmiri-disable-isolation

# 同じ target を 2 本同時に走らせない（「既存 issue なし」を両方が読んで二重起票する競合を消す）。
concurrency:
  group: miri-${{ matrix.target }}
  cancel-in-progress: false

jobs:
  miri:
    name: cargo miri (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: lib
            args: -p strided-view --lib
          - target: provenance
            args: -p strided-view --test view_mut_ptr_provenance
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          key: miri-${{ matrix.target }}

      - name: cargo miri setup
        run: cargo miri setup

      - name: cargo miri test
        id: run
        # ジョブ全体(120)より短くし、ハングしても通知ステップに必ず到達させる
        timeout-minutes: 60
        continue-on-error: true
        run: cargo miri test ${{ matrix.args }}

      # `steps.run.outcome` だけでなく **job の失敗全般**を拾う（setup 失敗・timeout でも起票する）。
      # main 以外（作業ブランチでの workflow_dispatch）では起票しない。
      - name: File an issue when Miri fails
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          TARGET: ${{ matrix.target }}
          ARGS: ${{ matrix.args }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          MARK="<!-- miri-failure:${TARGET} -->"
          # 既存 issue の検索は **タイトル**で絞る（open を 100 件取る方式は、issue が増えると
          # 既存を見落として重複起票する）。HTML コメントは GitHub の検索に索引されない。
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open \
            --search 'miri in:title' --json number,title --limit 50 \
            --jq "[.[] | select(.title == \"miri: ${ARGS} fails on main\")] | .[0].number // empty")
          body=$(mktemp)
          {
            echo "$MARK"
            echo "Miri (\`${ARGS}\`) が main で失敗しました。"
            echo
            echo "- commit: \`${SHA}\`"
            echo "- 実行: \`${RUN_URL}\`"
            echo "- 再現: \`MIRIFLAGS=-Zmiri-disable-isolation cargo +nightly miri test ${ARGS}\`"
            echo
            echo "provenance 違反は通常の \`cargo test\` では検出できません（このレーンだけが見ます）。"
          } > "$body"
          if [ -n "${existing}" ]; then
            gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body-file "$body"
            echo "commented on #${existing}"
          else
            # 失敗を握り潰さない: 起票できなければ **この step を赤くする**（通知が消えるのを防ぐ）
            gh issue create -R "$GITHUB_REPOSITORY" \
              --title "miri: ${ARGS} fails on main" \
              --body-file "$body"
          fi
          rm -f "$body"

      - name: Fail the job if Miri failed
        if: steps.run.outcome == 'failure'
        run: exit 1
