name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check

  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --profile ci

      - name: Overhead smoke gates (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          OVERHEAD_GATE=1 cargo bench --profile release -p strided-basic --bench overhead_smoke
          OVERHEAD_GATE=1 cargo bench --profile release -p strided-fused --bench overhead_smoke

      - name: Runtime SIMD dispatch check (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/check-runtime-simd-dispatch.py

      - name: Report Cargo artifact usage
        if: always()
        run: |
          du -sh target
          df -h target

  # Feature lanes, one job per lane so a lane cannot leak an activated feature
  # into another. The `default` lane is the `cargo test --profile ci` step of the
  # `test` job above; these are the lanes that need their own build.
  # `parallel-no-simd` is the intersection: the parallel token is on, pulp is off.
  features:
    name: feature lanes (${{ matrix.lane }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: parallel
            flags: --features strided-basic/parallel,strided-kernel/parallel,strided-fused/parallel,strided-perm/parallel
          - lane: no-default-features
            flags: --no-default-features
          - lane: parallel-no-simd
            flags: --no-default-features --features strided-basic/parallel,strided-kernel/parallel,strided-fused/parallel,strided-perm/parallel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: features-${{ matrix.lane }}
      - name: Run tests (${{ matrix.lane }})
        run: cargo test --profile ci --workspace ${{ matrix.flags }}

  placement:
    name: placement rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Only threadteam depends on rayon
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans

  scripts:
    name: maintenance scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the repository-rules review script
        run: python3 scripts/test-repository-rules-review.py
      - name: Test the runtime SIMD dispatch check script
        run: python3 scripts/test-check-runtime-simd-dispatch.py
      - name: Test the review waiver script
        run: node --test scripts/test-review-waiver.js

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage JSON
        run: cargo llvm-cov --workspace --json --output-path coverage.json
      - name: Check per-file thresholds
        run: python3 scripts/check-coverage.py coverage.json

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        run: cargo doc --workspace --no-deps
