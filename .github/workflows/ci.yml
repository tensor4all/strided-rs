name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # YAML の構文だけでなく「そのコンテキストがそこで使えるか」まで見る。
      # 実例: workflow 階層の `concurrency.group` で `matrix` を参照しており、
      # YAML としては正しいが GitHub が受け付けず、ワークフローが起動しなかった。
      - uses: raven-actions/actionlint@v2
        with:
          # shellcheck も走るが、`ci.yml` には既存の SC2086 が 3 件ある（本 PR の範囲外）。
          # 先に既存を直すまで shellcheck は切り、actionlint 本体（構文・コンテキスト）だけ強制する。
          shellcheck: false

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check

  # `clippy` was installed in the `test` job (below) and never run, so lints
  # accumulated unread (tensor4all/strided-rs#215). `-D warnings` turns both
  # `clippy::all` and the rustc warnings into failures; a lint that is correct
  # for a site is silenced there with `#[allow(...)]` plus a one-line reason,
  # never by loosening this gate.
  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Lint every target
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `--all-targets` cannot be combined with `parallel`: `strided-kernel/benches/
      # axis_ops.rs` needs type annotations under that feature set and no CI job has
      # ever built it (pre-existing, tracked separately). Every other target is
      # linted, because the `#[cfg(feature = "parallel")]` test files are code the
      # `parallel` lanes run and nothing else compiles.
      - name: Lint the parallel feature
        run: cargo clippy --workspace --features parallel --lib --tests --examples -- -D warnings

  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Backstop, measured on run 42451599046 (2026-11-08): this job takes 3m25s on
    # ubuntu. 30 min still surfaces a hang as a failure instead of leaving the job
    # `in_progress` (tensor4all/strided-rs#395), and it is far above the slowest
    # legitimate run, including a cold cargo cache.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # No `components: clippy`: clippy runs in its own job, and installing it here
      # only made this job look like it linted.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --profile ci

      # The step carries its own, tighter budget: the hang in #395 is here, and a
      # step timeout fails the job while still letting the `if: always()` step
      # below run. Measured at 1m34s on run 42451599046; 15 min is ~10x that.
      - name: Overhead smoke gates (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 15
        run: |
          OVERHEAD_GATE=1 cargo bench --profile release -p strided-basic --bench overhead_smoke
          OVERHEAD_GATE=1 cargo bench --profile release -p strided-fused --bench overhead_smoke

      - name: Runtime SIMD dispatch check (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/check-runtime-simd-dispatch.py

      - name: Report Cargo artifact usage
        if: always()
        run: |
          du -sh target
          df -h target

  # Feature lanes, one job per lane, each lane selecting its own crates and then
  # proving the feature set cargo actually compiled.
  #
  # The crates are selected with `-p` instead of building the workspace: a
  # workspace-wide `--no-default-features` run does not turn anything off, because
  # `strided-nn` requires `strided-basic/parallel` and depends on `pulp`
  # unconditionally (strided-nn/Cargo.toml:18,20), and feature unification then
  # keeps `threadteam/parallel` and `pulp` in every lane. `strided-nn` is covered
  # by the workspace-wide `test` job above, where those requirements are already
  # on.
  #
  # The `default` lane is the `test` job's `cargo test --profile ci` step. The
  # `parallel` lane runs on both operating systems, because it is the only place
  # the `#[cfg(feature = "parallel")]` tests of `strided-fused`
  # (strided-fused/src/fused/tests/tests.rs:336,778) and of `strided-kernel`
  # (strided-kernel/tests/erased_policy_parallel.rs, 13 tests) run alongside the
  # macOS host class.
  features:
    name: feature lanes (${{ matrix.lane }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      LANE_PACKAGES: >-
        -p strided-traits -p strided-view -p strided-basic -p strided-perm
        -p strided-kernel -p strided-fused
      # `strided-kernel` is absent from `LANE_TEST_PACKAGES`: its dev-dependency
      # `strided-nn` requires `strided-basic/parallel` and depends on `pulp`
      # unconditionally, and cargo unifies features across the whole invocation, so
      # any `cargo test` that includes `strided-kernel` re-enables parallelism and
      # `pulp` for every crate in the graph — which is what the `no-default-features`
      # and `parallel-no-simd` lanes exist to rule out. Its library is proven in all
      # four lanes below; its tests join only where those two features are on
      # anyway, through `LANE_TEST_EXTRA` (the two `parallel` rows). The `test` job
      # does not cover them either: it never enables `strided-kernel/parallel`, so
      # `tests/erased_policy_parallel.rs` is compiled nowhere else.
      LANE_TEST_PACKAGES: >-
        -p strided-traits -p strided-view -p strided-basic -p strided-perm
        -p strided-fused
      LANE_TEST_EXTRA: ${{ matrix.test_extra }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: parallel
            os: ubuntu-latest
            flags: --features strided-basic/parallel,strided-kernel/parallel,strided-fused/parallel,strided-perm/parallel
            test_flags: --features strided-basic/parallel,strided-kernel/parallel,strided-fused/parallel,strided-perm/parallel
            test_extra: -p strided-kernel
            basic: default parallel simd
            pulp: yes
          - lane: parallel
            os: macos-latest
            flags: --features strided-basic/parallel,strided-kernel/parallel,strided-fused/parallel,strided-perm/parallel
            test_flags: --features strided-basic/parallel,strided-kernel/parallel,strided-fused/parallel,strided-perm/parallel
            test_extra: -p strided-kernel
            basic: default parallel simd
            pulp: yes
          - lane: no-default-features
            os: ubuntu-latest
            flags: --no-default-features
            test_flags: --no-default-features
            test_extra: ""
            basic: ""
            pulp: no
          - lane: parallel-no-simd
            os: ubuntu-latest
            flags: --no-default-features --features strided-basic/parallel,strided-kernel/parallel,strided-fused/parallel,strided-perm/parallel
            test_flags: --no-default-features --features strided-basic/parallel,strided-fused/parallel,strided-perm/parallel
            test_extra: ""
            basic: parallel
            pulp: no
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: features-${{ matrix.lane }}-${{ matrix.os }}

      # A lane that compiles something other than its name is worse than no lane:
      # this reads the enabled feature list of every `strided-basic` unit cargo
      # built, and whether `pulp` was built at all. The library graph and the test
      # graph are asserted separately: they are not the same graph, and only the
      # test graph is what the tests actually run against.
      - name: Assert the lane's feature set (library graph)
        env:
          WANT_BASIC: ${{ matrix.basic }}
          WANT_PULP: ${{ matrix.pulp }}
        run: |
          cargo build --profile ci $LANE_PACKAGES ${{ matrix.flags }} --message-format=json \
            | python3 scripts/assert-lane-features.py

      - name: Assert the lane's feature set (test graph)
        env:
          WANT_BASIC: ${{ matrix.basic }}
          WANT_PULP: ${{ matrix.pulp }}
        run: |
          cargo test --profile ci $LANE_TEST_PACKAGES $LANE_TEST_EXTRA ${{ matrix.test_flags }} --no-run --message-format=json \
            | python3 scripts/assert-lane-features.py

      - name: Run tests (${{ matrix.lane }})
        run: cargo test --profile ci $LANE_TEST_PACKAGES $LANE_TEST_EXTRA ${{ matrix.test_flags }}

  placement:
    name: placement rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Only threadteam depends on rayon
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans

  scripts:
    name: maintenance scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the repository-rules review script
        run: python3 scripts/test-repository-rules-review.py
      - name: Test the runtime SIMD dispatch check script
        run: python3 scripts/test-check-runtime-simd-dispatch.py
      - name: Test the audit baseline counter
        run: python3 scripts/test-count-audit-metrics.py
      - name: Test the review waiver script
        run: node --test scripts/test-review-waiver.js
      - name: Check the two oracle copies are identical
        run: bash scripts/check-oracle-copy.sh

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage JSON
        run: cargo llvm-cov --workspace --json --output-path coverage.json
      - name: Check per-file thresholds
        run: python3 scripts/check-coverage.py coverage.json

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        run: cargo doc --workspace --no-deps
