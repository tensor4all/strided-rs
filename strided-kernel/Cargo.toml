[package]
name = "strided-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Cache-optimized kernels for strided multidimensional array operations in Rust (ported from Julia Strided.jl/StridedViews.jl)."

[dependencies]
strided-view.workspace = true
strided-perm.workspace = true
num-traits.workspace = true
num-complex.workspace = true
rayon = { workspace = true, optional = true }
smallvec = { workspace = true, optional = true }
pulp = { workspace = true, optional = true }

[features]
default = ["simd"]
parallel = ["dep:rayon", "dep:smallvec", "strided-perm/parallel"]
simd = ["dep:pulp"]

[dev-dependencies]
criterion.workspace = true
approx.workspace = true
rand.workspace = true
rand_distr.workspace = true
num-complex.workspace = true

[lib]
bench = false

[[bench]]
name = "rust_compare"
harness = false

[[bench]]
name = "scaling_compare"
harness = false

[[bench]]
name = "threaded_compare"
harness = false
required-features = ["parallel"]

[[bench]]
name = "rank25_permute"
harness = false

[[bench]]
name = "outer_product"
harness = false

[[bench]]
name = "mul_pytorch_compare"
harness = false

[[bench]]
name = "fused_elementwise"
harness = false

[[bench]]
name = "erased_policy_thresholds"
harness = false
required-features = ["parallel"]
