[workspace]
members = [
    "strided-basic",
    "strided-fused",
    "strided-traits",
    "strided-view",
    "strided-perm",
    "strided-kernel",
]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Satoshi Terasaki", "Hiroshi Shinaoka"]
repository = "https://github.com/tensor4all/strided-rs"

[workspace.dependencies]
strided-basic = { version = "0.5.3", path = "strided-basic", default-features = false }
strided-fused = { version = "0.5.1", path = "strided-fused", default-features = false }
strided-traits = { version = "0.5.0", path = "strided-traits" }
# Requirement stays 0.5.0 although strided-view is at 0.5.1: the published
# providers (tcontract, cpueinsum, cpueinsum-blas, tlinalg) pin strided-view
# =0.5.0, and no dependent needs a 0.5.1 item, so a 0.5.1 floor would force a
# provider re-release for nothing. See the 2026-10-17 release note.
strided-view = { version = "0.5.0", path = "strided-view" }
strided-perm = { version = "0.5.0", path = "strided-perm" }
strided-kernel = { version = "0.5.0", path = "strided-kernel" }

approx = "0.5"
criterion = "0.5"
elem-simd-math = "0.1.0"
num-complex = "0.4"
num-traits = "0.2"
pulp = "0.22"
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"
smallvec = "1"
thiserror = "1.0"

# Workspace tests instantiate large generic kernels in many executables.
# Omitting debuginfo keeps those artifacts small while preserving debug
# assertions and overflow checks from Cargo's default development profiles.
[profile.dev]
debug = 0

[profile.test]
debug = 0

# Hosted CI starts from cold caches, where incremental state has no value.
[profile.ci]
inherits = "test"
incremental = false
strip = "symbols"
