[workspace]
members = [
    "strided-basic",
    "strided-fused",
    "strided-nn",
    "strided-traits",
    "strided-view",
    "strided-perm",
    "strided-kernel",
]
resolver = "2"

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Satoshi Terasaki", "Hiroshi Shinaoka"]
repository = "https://github.com/tensor4all/strided-rs"

[workspace.dependencies]
strided-basic = { version = "0.8.0", path = "strided-basic", default-features = false }
strided-nn = { version = "0.8.0", path = "strided-nn", default-features = false }
strided-fused = { version = "0.8.0", path = "strided-fused", default-features = false }
strided-traits = { version = "0.7.0", path = "strided-traits" }
strided-view = { version = "0.7.0", path = "strided-view" }
strided-perm = { version = "0.8.0", path = "strided-perm" }
strided-kernel = { version = "0.8.0", path = "strided-kernel" }
threadteam = { git = "https://github.com/tensor4all/threadteam-rs", rev = "97404b580951aa9d89910a739618ce044e988b16", version = "0.1.0", default-features = false }

approx = "0.5"
criterion = "0.5"
elem-simd-math = "0.1.0"
num-complex = "0.4"
num-traits = "0.2"
pulp = "0.22"
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"
tinyvec = { version = "1", features = ["alloc"] }
thiserror = "1.0"

# Workspace tests instantiate large generic kernels in many executables.
# Omitting debuginfo keeps those artifacts small while preserving debug
# assertions and overflow checks from Cargo's default development profiles.
[profile.dev]
debug = 0

[profile.test]
debug = 0

# Hosted CI starts from cold caches, where incremental state has no value.
[profile.ci]
inherits = "test"
incremental = false
strip = "symbols"
