[package]
name = "strided-opteinsum"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "N-ary einsum frontend with contraction-order optimization for strided tensors."
readme = "README.md"
keywords = ["tensor", "einsum", "contraction", "optimization"]
categories = ["science", "mathematics", "algorithms"]

[dependencies]
strided-view.workspace = true
strided-kernel.workspace = true
strided-einsum2 = { workspace = true, default-features = false }
omeco.workspace = true
num-complex.workspace = true
num-traits.workspace = true
thiserror.workspace = true

[features]
default = ["faer"]
faer = ["strided-einsum2/faer", "strided-einsum2/faer-traits"]
parallel = ["strided-einsum2/parallel", "strided-kernel/parallel"]
blas = ["strided-einsum2/blas"]
blas-inject = ["strided-einsum2/blas-inject"]
blas-accelerate = ["blas", "strided-einsum2/blas-accelerate"]
blas-openblas = ["blas", "strided-einsum2/blas-openblas"]
blas-mkl = ["blas", "strided-einsum2/blas-mkl"]

[dev-dependencies]
approx.workspace = true
num-complex.workspace = true
rand.workspace = true
strided-view.workspace = true

[lib]
bench = false

[[bench]]
name = "manyinds"
harness = false

[[bench]]
name = "matmul"
harness = false

[[bench]]
name = "batchmul"
harness = false

[[bench]]
name = "dot"
harness = false

[[bench]]
name = "trace"
harness = false

[[bench]]
name = "ptrace"
harness = false

[[bench]]
name = "diag"
harness = false

[[bench]]
name = "perm"
harness = false

[[bench]]
name = "tcontract"
harness = false

[[bench]]
name = "star"
harness = false

[[bench]]
name = "starandcontract"
harness = false

[[bench]]
name = "indexsum"
harness = false

[[bench]]
name = "hadamard"
harness = false

[[bench]]
name = "outer"
harness = false
