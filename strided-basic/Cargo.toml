[package]
name = "strided-basic"
version = "0.10.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/strided-basic"
homepage = "https://github.com/tensor4all/strided-rs"
description = "Shared typed strided CPU primitives and copy/reduction execution."
keywords = ["tensor", "strided", "kernels", "numerical"]
categories = ["science", "mathematics", "algorithms"]

[dependencies]
strided-view.workspace = true
strided-perm.workspace = true
num-traits.workspace = true
num-complex.workspace = true
threadteam.workspace = true
tinyvec.workspace = true
pulp = { workspace = true, optional = true }

[features]
default = ["simd"]
parallel = ["threadteam/parallel", "strided-perm/parallel"]
simd = ["dep:pulp"]

[dev-dependencies]
criterion.workspace = true
approx.workspace = true
rand.workspace = true
rand_distr.workspace = true
num-complex.workspace = true
threadteam = { workspace = true, features = ["ledger"] }

[lib]
bench = false

[[bench]]
name = "map_uninit_kernel"
harness = false
required-features = ["parallel"]

[[bench]]
name = "product_reduce"
harness = false
required-features = ["parallel"]

[[bench]]
name = "broadcast_zip"
harness = false
required-features = ["parallel"]

[[bench]]
name = "overhead_smoke"
harness = false
